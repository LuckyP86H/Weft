name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The project itself plus the test deps: without them pylint reports
        # every third-party import as E0401 (import-error).
        # (pytest/pytest-asyncio live in uv's dev dependency-group, which pip
        # can't see, so they are named explicitly.)
        pip install -e .
        pip install pylint pytest pytest-asyncio
    - name: Analyzing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
