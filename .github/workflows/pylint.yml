name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.x"
    - name: Install dependencies
      # Python 3.15 comes from .python-version; pytest and pylint come from
      # the dev dependency group, so CI and local runs share one lockfile.
      run: uv sync --locked
    - name: Run tests
      run: uv run pytest
    - name: Analyzing the code with pylint
      run: uv run pylint $(git ls-files '*.py')
